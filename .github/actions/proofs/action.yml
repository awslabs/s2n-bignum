name: Run HOL Light proofs
description: Build the shared HOL base, fork a process per proof, and collect timings
inputs:
  arch:
    description: Proof architecture (arm or x86)
    required: true
  build-jobs:
    description: Parallel proof compilation jobs
    default: '15'
  proof-jobs:
    description: Parallel proof executions
    default: '64'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-hol-light
      with:
        linux-packages: binutils-aarch64-linux-gnu binutils-x86-64-linux-gnu
        apt-update-options: --allow-insecure-repositories

    - name: Build and run proofs and tutorials
      id: proofs
      shell: bash
      env:
        PROOF_ARCH: ${{ inputs.arch }}
        BUILD_JOBS: ${{ inputs.build-jobs }}
        PROOF_JOBS: ${{ inputs.proof-jobs }}
      run: make -C "$PROOF_ARCH" fork-proofs PROOF_OUTPUT="$RUNNER_TEMP/proof-logs"

    - name: Print proof and tutorial timing lines
      shell: bash
      env:
        PROOF_ARCH: ${{ inputs.arch }}
      run: tools/collect-times.sh "$RUNNER_TEMP/proof-logs/$PROOF_ARCH"

    - name: Upload failed proof diagnostics
      if: ${{ failure() && steps.proofs.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: proof-errors-${{ inputs.arch }}
        path: |
          ${{ runner.temp }}/proof-logs/base.log
          ${{ runner.temp }}/proof-logs/**/*.partial
        if-no-files-found: ignore
        overwrite: true

    - name: Collect crypto proof timings
      if: ${{ !cancelled() }}
      id: collect
      continue-on-error: ${{ github.event_name == 'pull_request' }}
      shell: bash
      env:
        PROOF_ARCH: ${{ inputs.arch }}
        BUILD_JOBS: ${{ inputs.build-jobs }}
        PROOF_JOBS: ${{ inputs.proof-jobs }}
        BUILD_SECONDS: ${{ steps.proofs.outputs.build_seconds }}
        PROOF_SECONDS: ${{ steps.proofs.outputs.proof_seconds }}
        PROOF_OUTCOME: ${{ steps.proofs.outcome }}
      run: |
        python3 tools/proof_timing/collect.py "$PROOF_ARCH" "$RUNNER_TEMP/timing.json" "$RUNNER_TEMP/proof-logs"
        echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

    # tools/proof_timing/report.py finds timings repository-wide by this
    # name. A rerun replaces this run's earlier upload.
    - name: Upload proof timings
      if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      continue-on-error: ${{ github.event_name == 'pull_request' }}
      with:
        name: proof-timing-${{ inputs.arch }}-${{ steps.collect.outputs.tree }}
        path: ${{ runner.temp }}/timing.json
        if-no-files-found: error
        overwrite: true
